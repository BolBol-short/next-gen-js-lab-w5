<!DOCTYPE html>
<!-- Instructor page — same idea as the trainee index.html, but loads the
     answer key. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe — SOLUTION</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Tic-Tac-Toe — SOLUTION</h1>
    <p>Instructor copy. Loads JS/script.SOLUTION.js.</p>

    <div id="mode-select">
        <button id="mode-1p" class="action-btn">1 Player (vs Computer)</button>
        <button id="mode-2p" class="action-btn">2 Player</button>
    </div>

    <div id="game-area" class="hidden">
        <p id="status">Loading...</p>
        <div id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <script src="JS/script.SOLUTION.js"></script>
</body>
</html>
