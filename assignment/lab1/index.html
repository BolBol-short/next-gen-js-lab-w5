<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Playground — Week 5 · Lab 1</title>
</head>
<body>
    <!-- ============================================================
         PROVIDED markup — do not edit. Each exercise has its own
         section below. Every exercise script ends by calling
         .click() on the relevant button itself, so the console
         output is the same whether you click by hand or just open
         the page. Open with Live Server, then press F12 for the
         console.
    ============================================================= -->

    <h2>Exercise 1 — Event Handler</h2>
    <button id="btn-inline" onclick="handleInlineClick()">Inline Click</button>
    <p id="inline-result">not clicked</p>
    <button id="btn-property">Property Click</button>
    <p id="property-result">not clicked</p>

    <h2>Exercise 2 — Event Listener</h2>
    <button id="btn-multi">Multi</button>
    <p id="multi-log"></p>
    <button id="btn-remove">Remove</button>
    <p id="remove-log">not clicked</p>

    <h2>Exercise 3 — The Event Object</h2>
    <div id="ex3-box">Click Me Box</div>
    <p id="ex3-type"></p>

    <h2>Exercise 4 — Event Delegation</h2>
    <ul id="ex4-list">
        <li data-fruit="apple">Apple</li>
        <li data-fruit="banana">Banana</li>
        <li data-fruit="cherry">Cherry</li>
    </ul>
    <p id="ex4-result">none selected</p>

    <h2>Exercise 5 — stopPropagation</h2>
    <div id="ex5-outer">
        Outer
        <button id="ex5-inner">Inner Button</button>
    </div>
    <p id="ex5-outer-log">outer not triggered</p>
    <p id="ex5-inner-log">inner not triggered</p>

    <!-- YOUR WORK: complete the TODOs in each exercise file -->
    <script src="exercise1.js"></script>
    <script src="exercise2.js"></script>
    <script src="exercise3.js"></script>
    <script src="exercise4.js"></script>
    <script src="exercise5.js"></script>
</body>
</html>
